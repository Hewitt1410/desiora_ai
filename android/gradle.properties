# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official

# JDK Configuration
# Set the JDK path for Gradle (Java 17 or 21 required for AGP 8.2.0)
# If you get "Invalid Gradle JDK configuration" error in Android Studio:
# 1. Go to File > Settings > Build, Execution, Deployment > Build Tools > Gradle
# 2. Set "Gradle JDK" to "jbr-17" or "jbr-21" (JetBrains Runtime)
# 3. Or uncomment the line below and set the path to your JDK
org.gradle.java.home=/usr/lib/jvm/java-21-openjdk-amd64

# API Configuration
API_BASE_URL=http://10.0.2.2:8000
GOOGLE_CLIENT_ID=your-google-client-id




