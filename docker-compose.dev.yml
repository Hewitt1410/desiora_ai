version: '3.8'

# Development override for docker-compose.yml
services:
  backend:
    build:
      target: development
    environment:
      - DEBUG=true
      - ENVIRONMENT=development
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    environment:
      - DEBUG=true
      - ENVIRONMENT=development
    volumes:
      - ./app:/app/app
      - ./models_cache:/app/models_cache

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"


