name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to ${{ github.event.inputs.environment }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets[format('{0}_HOST', github.event.inputs.environment)] }}
          username: ${{ secrets[format('{0}_USER', github.event.inputs.environment)] }}
          key: ${{ secrets[format('{0}_SSH_KEY', github.event.inputs.environment)] }}
          script: |
            cd /opt/desiora_ai
            git pull origin main
            docker-compose -f docker-compose.yml -f docker-compose.${{ github.event.inputs.environment }}.yml pull
            docker-compose -f docker-compose.yml -f docker-compose.${{ github.event.inputs.environment }}.yml up -d --build
            docker-compose -f docker-compose.yml -f docker-compose.${{ github.event.inputs.environment }}.yml exec -T backend alembic upgrade head



